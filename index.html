<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Piano Partitura</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1220;color:#f3efe6;font:15px -apple-system,system-ui,sans-serif;overflow:hidden}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:#171b31}
button{background:#262c4d;color:#f3efe6;border:0;border-radius:10px;padding:9px 12px;font-size:15px}
button.on{background:#3ad1c4;color:#0f1220}
#st{flex:1;min-width:140px;font-size:13px;opacity:.85}
#cv{display:block;width:100%;height:calc(100% - 96px);height:calc(100dvh - 96px);touch-action:none}
#ed{position:fixed;inset:0;background:#0f1220ee;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;overflow:auto}
#ed[hidden]{display:none}
textarea{width:100%;height:38vh;background:#171b31;color:#f3efe6;border:1px solid #3a4170;border-radius:10px;padding:10px;font:15px ui-monospace,monospace}
#ed p{font-size:13px;opacity:.8;line-height:1.45}
#ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#ffb703;color:#0f1220;padding:9px 14px;border-radius:12px;font-weight:600;max-width:90%;text-align:center;display:none}
</style></head><body>
<div id="bar"><button id="b1">📁 Partitura</button><button id="b2">🎤 Mic</button><button id="b3">✏️</button><button id="b4">⏮</button><button id="bl">◀</button><button id="br">▶</button><span id="st"></span></div>
<canvas id="cv"></canvas>
<div id="ed" hidden>
<p><b>Notas lidas / editor.</b> Separe por espaço. Acorde com <b>+</b> (C4+E4+G4). Sustenido <b>#</b>, bemol <b>b</b> (F#4, Bb3). Faixa do teclado: C2 a C6. A leitura automática da partitura é aproximada: corrija aqui o que precisar.</p>
<textarea id="tx" spellcheck="false"></textarea>
<p>Sensibilidade do microfone (mais à direita = capta sons mais fracos)<br><input type="range" id="sn" min="0" max="100" value="50" style="width:100%"></p>
<button id="ok">✔ Aplicar</button> <button id="cl">Fechar</button> <button id="dm">🎵 Música exemplo</button>
</div>
<div id="ts"></div>
<input type="file" id="f" accept="image/*,application/pdf" hidden>

<script id="core">
const LO=36,HI=84;
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm=m=>NN[m%12]+(Math.floor(m/12)-1);
function parseNote(t){const r=/^([A-Ga-g])([#b]?)(-?\d)$/.exec(t);if(!r)return null;return 12*(+r[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1].toUpperCase()]+(r[2]=='#'?1:r[2]=='b'?-1:0)}
function parseSong(s){return s.split(/\s+/).filter(Boolean).map(t=>t.split('+').map(parseNote).filter(m=>m!=null&&m>=LO&&m<=HI).map(m=>({m,h:m>=60?1:0}))).filter(a=>a.length)}
const songText=s=>s.map(a=>a.map(n=>nm(n.m)).join('+')).join(' ');

/* ---- leitura da partitura (OMR simples) ---- */
function omr(g,w,h){
 const n=w*h,hist=new Uint32Array(256);for(let i=0;i<n;i++)hist[g[i]]++;
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sb=0,wb=0,mx=0,th=128;
 for(let i=0;i<256;i++){wb+=hist[i];const wf=n-wb;if(!wb)continue;if(!wf)break;sb+=i*hist[i];const a=sb/wb-(sum-sb)/wf,v=wb*wf*a*a;if(v>mx){mx=v;th=i}}
 const ink=new Uint8Array(n);for(let i=0;i<n;i++)ink[i]=g[i]<=th?1:0;
 const cnt=new Uint32Array(h);let mc=0;
 for(let y=0;y<h;y++){let c=0;for(let x=0,o=y*w;x<w;x++)c+=ink[o+x];cnt[y]=c;if(c>mc)mc=c}
 const L=[];for(let y=0;y<h;){if(cnt[y]>0.45*mc){const a=y;while(y<h&&cnt[y]>0.45*mc)y++;L.push({c:(a+y-1)/2,t:y-a,a})}else y++}
 const S=[];
 for(let i=0;i+4<L.length;){const d=(L[i+4].c-L[i].c)/4;let ok=d>=5;for(let k=0;k<4&&ok;k++)if(Math.abs(L[i+k+1].c-L[i+k].c-d)>0.25*d)ok=false;
  if(ok){const ls=L.slice(i,i+5);const r=Math.round(ls[2].c)*w;let x0=0;while(x0<w&&!ink[r+x0])x0++;S.push({y:ls.map(l=>l.c),d,ra:ls.map(l=>[l.a,l.t]),x0});i+=5}else i++}
 function staffNotes(st,bass){
  const d=st.d,k=Math.max(2,Math.round(d*0.55)),r=k>>1,pad=Math.round(4.5*d);
  const ya=Math.max(0,Math.round(st.y[0]-pad)),yb=Math.min(h,Math.round(st.y[4]+pad)),bh=yb-ya,N=w*bh;
  const b=new Uint8Array(N);for(let y=0;y<bh;y++)for(let x=0;x<w;x++)b[y*w+x]=ink[(y+ya)*w+x];
  /* preenche notas vazadas: só buracos pequenos (não os compassos) */
  const rc=new Uint8Array(N),q=new Int32Array(N);let qh=0,qt=0;
  const add=p=>{if(!b[p]&&!rc[p]){rc[p]=1;q[qt++]=p}};
  for(let x=0;x<w;x++){add(x);add((bh-1)*w+x)}for(let y=0;y<bh;y++){add(y*w);add(y*w+w-1)}
  while(qh<qt){const p=q[qh++],px=p%w;if(px>0)add(p-1);if(px<w-1)add(p+1);if(p>=w)add(p-w);if(p<N-w)add(p+w)}
  const lim=1.6*d*d;
  for(let i=0;i<N;i++){if(b[i]||rc[i])continue;const lst=[i];rc[i]=1;
   for(let a=0;a<lst.length;a++){const p=lst[a],px=p%w,nb=[];if(px>0)nb.push(p-1);if(px<w-1)nb.push(p+1);if(p>=w)nb.push(p-w);if(p<N-w)nb.push(p+w);
    for(const z of nb)if(!b[z]&&!rc[z]){rc[z]=1;lst.push(z)}}
   if(lst.length<=lim)for(const z of lst)b[z]=1}
  /* remove linhas da pauta (mantém o que cruza: hastes e cabeças) */
  for(const [a0,t0] of st.ra)for(let x=0;x<w;x++){const u=b[(a0-1-ya)*w+x],dn=b[(a0+t0-ya)*w+x];if(!(u&&dn))for(let y=a0;y<a0+t0;y++)if(y>=ya&&y<yb)b[(y-ya)*w+x]=0}
  /* erosão com integral */
  const W1=w+1,I=new Int32Array(W1*(bh+1));
  for(let y=0;y<bh;y++){let rs=0;for(let x=0;x<w;x++){rs+=b[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+rs}}
  const e=new Uint8Array(N);
  for(let y=r;y+k-r<=bh;y++)for(let x=r;x+k-r<=w;x++){const a=y-r,c=x-r;if(I[(a+k)*W1+c+k]-I[a*W1+c+k]-I[(a+k)*W1+c]+I[a*W1+c]==k*k)e[y*w+x]=1}
  const vis=new Uint8Array(N),out=[];
  for(let i=0;i<N;i++){if(!e[i]||vis[i])continue;
   const st2=[i];vis[i]=1;let x0=w,x1=0,y0=bh,y1=0;
   while(st2.length){const p=st2.pop(),px=p%w,py=(p-px)/w;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
    const go=z=>{if(e[z]&&!vis[z]){vis[z]=1;st2.push(z)}};
    if(px>0)go(p-1);if(px<w-1)go(p+1);if(py>0)go(p-w);if(py<bh-1)go(p+w)}
   const W0=x1-x0+k,H0=y1-y0+k,cxm=(x0+x1)/2;
   if(W0<0.8*d||W0>2.6*d||H0<0.6*d||H0>5*d||cxm<st.x0+5*d)continue;
   const nh=Math.max(1,Math.round(H0/d));
   for(let j=0;j<nh;j++){const cy=ya+(y0-r)+(j+.5)*H0/nh,p=Math.round((st.y[4]-cy)/(d/2)),dia=(bass?18:30)+p;
    const m=12*(Math.floor(dia/7)+1)+[0,2,4,5,7,9,11][((dia%7)+7)%7];
    if(m>=LO&&m<=HI)out.push({x:cxm,m,h:bass?0:1})}}
  return out}
 const steps=[];
 const conn=(a,b2)=>{const y0=Math.ceil(a.y[4])+2,y1=Math.floor(b2.y[0])-2;if(y1<=y0)return false;for(let x=a.x0;x<a.x0+6;x++){let c=0;for(let y=y0;y<=y1;y++)c+=ink[y*w+x];if(c>.9*(y1-y0+1))return true}return false};
 for(let i=0;i<S.length;){const a=S[i],pair=S[i+1]&&S[i+1].y[0]-a.y[4]<20*a.d&&conn(a,S[i+1]),grp=pair?[a,S[i+1]]:[a];i+=grp.length;
  const notes=[];grp.forEach((st,k)=>notes.push(...staffNotes(st,k==1)));
  notes.sort((p,q)=>p.x-q.x);let cur=null;
  for(const nt of notes){if(cur&&nt.x-cur.x<a.d*1.1)cur.a.push(nt);else{cur={x:nt.x,a:[nt]};steps.push(cur)}}}
 return steps.map(s=>{const seen={};return s.a.filter(n=>seen[n.m]?0:(seen[n.m]=1)).map(n=>({m:n.m,h:n.h}))})}

/* ---- análise de áudio: força de cada nota (fundamental + harmônicos) ---- */
function hann(N){const w=new Float32Array(N);for(let i=0;i<N;i++)w[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));return w}
function analyze(buf,sr,win){
 const N=buf.length,x=new Float32Array(N);let e=0;
 for(let i=0;i<N;i++){x[i]=buf[i]*win[i];e+=buf[i]*buf[i]}
 const M=new Float32Array(HI+25);
 for(let m=LO;m<=HI+24;m++){const f=440*Math.pow(2,(m-69)/12);if(f>sr*.45)continue;
  const c=2*Math.cos(2*Math.PI*f/sr);let s1=0,s2=0;for(let i=0;i<N;i++){const s=x[i]+c*s1-s2;s2=s1;s1=s}
  M[m]=Math.sqrt(Math.max(0,s1*s1+s2*s2-c*s1*s2))/N}
 const S=new Float32Array(HI+1);
 for(let m=LO;m<=HI;m++)S[m]=M[m]+.6*M[m+12]+.4*M[m+19]+.25*M[m+24];
 return{S,M,rms:Math.sqrt(e/N)}}
function judge(a,E,minRms){
 const S=a.S;let dom=LO,mx=0;for(let m=LO;m<=HI;m++)if(S[m]>mx){mx=S[m];dom=m}
 if(a.rms<minRms||mx<=0)return{ok:false,dom:null};
 let ok=E.some(e=>(e-dom)%12==0);
 for(const e of E){const s=S[e];
  if(s<.3*mx)ok=false;
  if(e>=48){const nb=Math.max(E.includes(e-1)?0:S[e-1],E.includes(e+1)||e==HI?0:S[e+1]);if(s<1.15*nb)ok=false}
  if(e-12>=LO&&!E.includes(e-12)&&S[e-12]>s)ok=false;
  if(e+12<=HI&&!E.includes(e+12)&&S[e+12]>s)ok=false}
 return{ok,dom}}
</script>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),g2=cv.getContext('2d');
const PT=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const COL=['#3ad1c4','#ffb703'],isBlk=m=>[1,3,6,8,10].includes(m%12);
const wpos={},whites=[];{let c=0;for(let m=LO;m<=HI;m++){if(!isBlk(m)){wpos[m]=c++;whites.push(m)}else wpos[m]=wpos[m-1]+.65}}
const NW=whites.length,cenX=m=>wpos[m]+(isBlk(m)?.3:.5);
let song=[],idx=0,dispIdx=0,cam=0,manual=false,lastAdv=0,vt={},wrongM=null,wrongT=0,micHit=false,okc=0,minRms=.01,VIS=13,wk=30,kh=100,ky=300,micOn=false,stream=null,AC=null,lastDom=null,domT=0;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state!='running')AC.resume();return AC}
let tT;function toast(s,ms=3500){const t=$('ts');t.textContent=s;t.style.display='block';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',ms)}
function rs(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;VIS=Math.max(10,Math.min(NW,Math.round(cv.clientWidth/30)))}
addEventListener('resize',rs);

/* piano virtual com som */
function tone(m){const c=ac(),f=440*Math.pow(2,(m-69)/12),o=c.createOscillator(),o2=c.createOscillator(),gn=c.createGain(),t=c.currentTime;
 o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.3,t+.01);gn.gain.exponentialRampToValueAtTime(.001,t+2.5);
 o.connect(gn);o2.connect(gn);gn.connect(c.destination);o.start();o2.start();o.stop(t+2.6);o2.stop(t+2.6);
 return()=>{gn.gain.cancelScheduledValues(c.currentTime);gn.gain.setTargetAtTime(0,c.currentTime,.07)}}
function hit(x,y){if(y<ky)return null;
 if(y<ky+kh*.62)for(let m=LO;m<=HI;m++)if(isBlk(m)){const bx=(wpos[m]-cam)*wk;if(x>=bx&&x<=bx+.6*wk)return m}
 const i=Math.floor(x/wk+cam);return i>=0&&i<NW?whites[i]:null}
const down={};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),d=cv.width/r.width,m=hit((e.clientX-r.left)*d,(e.clientY-r.top)*d);if(m==null)return;e.preventDefault();cv.setPointerCapture(e.pointerId);down[e.pointerId]={m,off:tone(m)};vt[m]=performance.now()});
const up=e=>{const o=down[e.pointerId];if(o){o.off();delete down[e.pointerId]}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* progresso */
function setSong(s){song=s;idx=0;dispIdx=0;lastAdv=performance.now();vt={};okc=0;micHit=false;manual=false;status()}
function status(){$('st').textContent=idx>=song.length?(song.length?'🎉 Terminou!':'Carregue uma partitura'):`Passo ${idx+1}/${song.length} · toque: ${song[idx].map(n=>PT[n.m%12]+(Math.floor(n.m/12)-1)).join(' + ')}`}
function advance(now){idx++;lastAdv=now;okc=0;micHit=false;manual=false;status();if(idx>=song.length)toast('🎉 Parabéns, você terminou a música!')}
function check(now){if(idx>=song.length||now-lastAdv<450)return;const E=song[idx].map(n=>n.m);
 if(E.every(m=>vt[m]>lastAdv)||micHit)advance(now)}

/* microfone */
const WIN=hann(8192),MB=new Float32Array(8192);let an=null;
async function mic(){
 if(micOn){micOn=false;stream.getTracks().forEach(t=>t.stop());$('b2').classList.remove('on');return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const c=ac(),s=c.createMediaStreamSource(stream);an=c.createAnalyser();an.fftSize=8192;s.connect(an);micOn=true;$('b2').classList.add('on');toast('Microfone ligado. Toque a nota!')}
 catch(err){toast('Sem acesso ao microfone. Abra pelo https (GitHub Pages) e permita no Safari.',6000)}}
setInterval(()=>{if(!micOn||!an||idx>=song.length)return;
 an.getFloatTimeDomainData(MB);const a=analyze(MB,AC.sampleRate,WIN),now=performance.now();
 const E=song[idx].map(n=>n.m),j=judge(a,E,minRms);
 if(j.dom){lastDom=j.dom;domT=now}
 if(now-lastAdv<450){okc=0;return}
 if(j.ok){if(++okc>=2)micHit=true}else{okc=0;if(j.dom){wrongM=j.dom;wrongT=now}}},70);

/* arquivos */
function loadPdf(){return window.pdfjsLib?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
 s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()};s.onerror=()=>rej(new Error('pdf.js'));document.head.appendChild(s)})}
$('f').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;toast('Lendo a partitura…',60000);
 try{const pages=[];
  if(f.type=='application/pdf'||/\.pdf$/i.test(f.name)){await loadPdf();const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
   for(let p=1;p<=Math.min(pdf.numPages,15);p++){const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:1600/v0.width}),c=document.createElement('canvas');c.width=v.width|0;c.height=v.height|0;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;pages.push(c)}}
  else{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
   const c=document.createElement('canvas');c.width=1600;c.height=Math.round(im.naturalHeight*1600/im.naturalWidth);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);pages.push(c)}
  let all=[];
  for(const c of pages){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,gr=new Uint8Array(c.width*c.height);
   for(let i=0;i<gr.length;i++)gr[i]=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;
   all=all.concat(omr(gr,c.width,c.height));await new Promise(r=>setTimeout(r))}
  if(!all.length){toast('Não achei notas. Use ✏️ para digitar a música.',5000);openEd()}
  else{setSong(all);toast(`Li ${all.length} passos. Confira no ✏️ se as notas estão certas.`,5000)}}
 catch(err){toast('Erro ao abrir o arquivo: '+(err.message||err),6000)}};

/* editor */
function openEd(){$('tx').value=songText(song);$('ed').hidden=false}
$('b1').onclick=()=>$('f').click();$('b2').onclick=mic;$('b3').onclick=openEd;
$('b4').onclick=()=>setSong(song);
$('bl').onclick=()=>{manual=true;cam=Math.max(0,cam-3)};$('br').onclick=()=>{manual=true;cam=Math.min(NW-VIS,cam+3)};
$('cl').onclick=()=>$('ed').hidden=true;
$('ok').onclick=()=>{const s=parseSong($('tx').value);$('ed').hidden=true;if(s.length){setSong(s);toast(`${s.length} passos carregados`)}else toast('Nenhuma nota válida')};
$('dm').onclick=()=>{$('tx').value='E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4 D4 D4 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4 C4+E4+G4 G3+B3+D4 C4+E4+G4';};
$('sn').oninput=e=>{minRms=.0015*Math.pow(40,(100-e.target.value)/100)};$('sn').oninput({target:$('sn')});

/* desenho */
function rr(x,y,w,h,r,f){g2.beginPath();g2.roundRect?g2.roundRect(x,y,w,h,r):g2.rect(x,y,w,h);g2.fillStyle=f;g2.fill()}
function frame(now){
 const W=cv.width,H=cv.height,d=devicePixelRatio||1;wk=W/VIS;kh=Math.min(H*.34,wk*5.2);ky=H-kh;
 g2.fillStyle='#0f1220';g2.fillRect(0,0,W,H);
 /* trilhas */
 for(let i=0;i<NW;i++){const x=(i-cam)*wk;if(x<-wk||x>W)continue;g2.fillStyle=i%2?'#12162a':'#141830';g2.fillRect(x,0,wk,ky)}
 dispIdx+=(idx-dispIdx)*.18;
 const nh=Math.max(30*d,wk*1.05),gap=nh*1.25,hitY=ky-6*d;
 /* alvo de câmera */
 if(idx<song.length&&!manual){const ms=song[idx].map(n=>cenX(n.m)),t=Math.max(0,Math.min(NW-VIS,ms.reduce((a,b)=>a+b)/ms.length-VIS/2));cam+=(t-cam)*.12}
 for(let j=Math.min(song.length-1,idx+7);j>=Math.max(0,idx-1);j--){
  const y=hitY-(j-dispIdx)*gap-nh;if(y<-nh)continue;
  g2.globalAlpha=j<idx?Math.max(0,1-(idx-dispIdx))*.6:j==idx?1:Math.max(.35,1-(j-idx)*.13);
  for(const n of song[j]){const bw=isBlk(n.m)?.55:.9,x=(cenX(n.m)-cam)*wk-bw*wk/2;
   if(x+bw*wk<0||x>W)continue;
   rr(x,y,bw*wk,nh-4*d,10*d,COL[n.h]);
   g2.fillStyle='#0f1220';g2.font=`bold ${Math.min(15*d,wk*.4)}px -apple-system,sans-serif`;g2.textAlign='center';g2.fillText(PT[n.m%12],x+bw*wk/2,y+nh/2+4*d)}}
 g2.globalAlpha=1;
 /* setas quando a nota está fora da tela */
 if(idx<song.length){g2.fillStyle='#ffb703';g2.font=`${28*d}px sans-serif`;
